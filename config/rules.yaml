# Multi-Camera Rule Engine Configuration
# Rules can be bound to a specific camera (e.g. camera_id: "cam_01") or wildcard (camera_id: "*")

rules:
  - id: "rule_zone_01"
    name: "Front Gate Restricted Area Intrusion"
    camera_id: "cam_01"         # Applies only to Camera 1 (Front Gate)
    enabled: true
    type: "zone_intrusion"
    params:
      target_classes: ["person"]
      zone:
        points:
          - [200, 150]
          - [600, 150]
          - [600, 550]
          - [200, 550]
    alert:
      severity: "high"
      message: "Unauthorized person detected in restricted safety zone at Front Gate"
      cooldown_sec: 15

  - id: "rule_count_01"
    name: "Loading Dock Vehicle Line Crossing Counter"
    camera_id: "cam_02"         # Applies only to Camera 2 (Loading Dock)
    enabled: true
    type: "line_crossing"
    params:
      target_classes: ["car", "truck", "bus", "motorcycle"]
      line:
        start: [100, 400]
        end: [1180, 400]
      direction: "down"
    alert:
      severity: "info"
      message: "Vehicle crossed loading dock boundary"
      cooldown_sec: 1

  - id: "rule_perimeter_all"
    name: "General Perimeter Intrusion"
    camera_id: "*"              # Wildcard: Applies across all camera channels
    enabled: true
    type: "zone_intrusion"
    params:
      target_classes: ["person"]
      zone:
        points:
          - [50, 50]
          - [400, 50]
          - [400, 300]
          - [50, 300]
    alert:
      severity: "critical"
      message: "Perimeter breach detected across facility cameras"
      cooldown_sec: 10
