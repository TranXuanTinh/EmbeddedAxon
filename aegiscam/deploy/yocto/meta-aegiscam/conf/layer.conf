# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-aegiscam"
BBFILE_PATTERN_meta-aegiscam = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-aegiscam = "10"

LAYERDEPENDS_meta-aegiscam = "core"
LAYERSERIES_COMPAT_meta-aegiscam = "kirkstone scarthgap"
